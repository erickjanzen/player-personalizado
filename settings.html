<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações</title><style>
:root{color-scheme:dark;--bg:#1b1d2a;--panel:#242738;--accent:#4cc9f0;--fg:#eef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px 'Segoe UI',sans-serif;padding:20px}h1{font-size:20px;margin:0 0 5px}p.sub{opacity:.6;margin:0 0 20px;font-size:12px}.section{background:var(--panel);border:1px solid #fff2;border-radius:10px;padding:15px;margin-bottom:13px}.section h2{font-size:12px;letter-spacing:.08em;opacity:.65;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:11px 0}.row label{flex:1}input[type=color]{width:45px;height:27px;border:0;background:none;padding:0}input,select,button{accent-color:var(--accent)}select{background:#151724;color:var(--fg);border:1px solid #fff3;border-radius:6px;padding:6px;min-width:140px}input[type=checkbox]{width:16px;height:16px}.item{display:flex;align-items:center;gap:8px;margin:8px 0}.item span{flex:1}.item button{width:28px;height:26px;border:0;border-radius:5px;background:#fff2;color:var(--fg);cursor:pointer}.hint{font-size:11px;opacity:.55;margin-top:8px}#status{font-size:11px;opacity:.55;margin-top:8px}
</style></head><body><h1>Configurações do player</h1><p class="sub">Personalize a aparência, o espectro e o comportamento.</p>
<div class="section"><h2>APARÊNCIA E CORES</h2><div class="row"><label for="bg">Cor de fundo</label><input type="color" id="bg"></div><div class="row"><label for="spColor">Cor do espectro</label><input type="color" id="spColor"></div><div class="row"><label for="spGradient">Gradiente personalizado (até 3 cores)</label><input type="checkbox" id="spGradient"></div><div class="row"><label for="spColor1">Cor do gradiente 1</label><input type="color" id="spColor1"></div><div class="row"><label for="spColor2">Cor do gradiente 2</label><input type="color" id="spColor2"></div><div class="row"><label for="spColor3">Cor do gradiente 3</label><input type="color" id="spColor3"></div><div class="row"><label for="spRgb">RGB arco-íris</label><input type="checkbox" id="spRgb"></div></div>
<div class="section"><h2>ELEMENTOS</h2><div class="row"><label for="optSpec">Espectro musical</label><input type="checkbox" id="optSpec"></div><div class="row"><label for="optProg">Barra de tempo</label><input type="checkbox" id="optProg"></div><div class="row"><label for="optCover">Capa da música</label><input type="checkbox" id="optCover"></div><div class="row"><label for="optPopup">Mostrar ao trocar de música (3s)</label><input type="checkbox" id="optPopup"></div></div>
<div class="section"><h2>LAYOUT</h2><div class="row"><label for="playerLayout">Orientação</label><select id="playerLayout"><option value="horizontal">Horizontal</option><option value="vertical">Vertical (MP3 player)</option></select></div><div class="row"><label for="barPos">Posição dos botões</label><select id="barPos"><option value="right">Direita</option><option value="left">Esquerda</option><option value="top">Topo</option><option value="bottom">Embaixo</option></select></div><div class="row"><label for="coverSide">Posição da capa</label><select id="coverSide"><option value="left">Esquerda</option><option value="right">Direita</option></select></div></div>
<div class="section"><h2>BOTÕES DO PLAYER</h2><div id="blist"></div><div class="hint">Se ocultar o botão de configurações, abra esta janela pelo ícone do player na bandeja do Windows.</div></div><div id="status">Alterações salvas automaticamente.</div>
<script>
const $=id=>document.getElementById(id);let cfg;const BIND=[['bg','bg','value'],['spColor','spectrumColor','value'],['spGradient','spectrumGradient','checked'],['spColor1','spectrumColor1','value'],['spColor2','spectrumColor2','value'],['spColor3','spectrumColor3','value'],['spRgb','spectrumRgb','checked'],['optSpec','spectrum','checked'],['optProg','showProgress','checked'],['optCover','showCover','checked'],['optPopup','popup','checked'],['barPos','barPos','value'],['coverSide','coverSide','value'],['playerLayout','playerLayout','value']];
const names={pin:'Fixar na tela',gear:'Configurações',close:'Ocultar player'};
async function update(p){cfg=await api.setSettings(p);apply();$('status').textContent='Alterações salvas automaticamente.'}
function apply(){BIND.forEach(([id,k,prop])=>{if($(id)[prop]!==cfg[k])$(id)[prop]=cfg[k]});renderList()}
BIND.forEach(([id,k,prop])=>$(id).addEventListener('input',e=>update({[k]:e.target[prop]})));
function renderList(){const box=$('blist');box.innerHTML='';cfg.buttons.filter(b=>b.id!=='close').forEach((b,i)=>{const row=document.createElement('div');row.className='item';const check=document.createElement('input');check.type='checkbox';check.checked=b.on;check.onchange=e=>{const a=cfg.buttons.map(x=>({...x}));a[i].on=e.target.checked;update({buttons:a})};const label=document.createElement('span');label.textContent=names[b.id]||b.id;row.append(check,label);[['↑',-1],['↓',1]].forEach(([t,d])=>{const bt=document.createElement('button');bt.textContent=t;bt.disabled=i+d<0||i+d>=cfg.buttons.length;bt.onclick=()=>{const a=cfg.buttons.map(x=>({...x}));[a[i],a[i+d]]=[a[i+d],a[i]];update({buttons:a})};row.append(bt)});box.append(row)})}
api.getSettings().then(s=>{cfg=s;apply()});api.onSettings(s=>{cfg=s;apply()});
</script></body></html>
